<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>小馬蕾 × 芙蕾雅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* 版面：手機直式單欄 — 狀態卡 → 房間畫面 → 動作面板。刻意採用單一暖色主題（像一台粉色電子雞機身），不跟隨深色模式。 */
:root{
  color-scheme: light;
  --bg:#F9E9EC;          /* 機身底色：淡櫻花 */
  --panel:#FFF9F8;       /* 面板 */
  --ink:#4A2B31;         /* 文字：深可可 */
  --muted:#8F6A71;
  --hair:#EDD0D6;        /* 分隔線 */
  --mare:#DE7690;        /* 小馬蕾代表色 */
  --mare-soft:#FBE0E7;
  --freya:#DE9A2E;       /* 芙蕾雅代表色 */
  --freya-soft:#FCEBCB;
  --low:#D5544E;
  --font:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --r:16px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-tap-highlight-color:transparent}
.app{max-width:470px;margin:0 auto;padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:21px;font-weight:400;letter-spacing:.02em;text-wrap:balance}
.brand h1 .m{color:var(--mare)}.brand h1 .f{color:var(--freya)}.brand h1 .x{color:var(--muted);font-size:15px;padding:0 2px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--hair);background:var(--panel);color:var(--ink);border-radius:999px;height:36px;padding:0 14px;font:inherit;font-size:13px;cursor:pointer}
.icon-btn:focus-visible,.card:focus-visible,.act:focus-visible,.tab:focus-visible,.opt:focus-visible{outline:3px solid var(--mare);outline-offset:2px}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{min-width:0;text-align:left;font:inherit;color:inherit;background:var(--panel);border:2px solid transparent;border-radius:var(--r);padding:8px 10px 9px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s, transform .15s}
.card[data-pet=mare][aria-pressed=true]{border-color:var(--mare)}
.card[data-pet=freya][aria-pressed=true]{border-color:var(--freya)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.card-name{font-size:15px}
.card[data-pet=mare] .card-name{color:var(--mare)}.card[data-pet=freya] .card-name{color:var(--freya)}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--mare-soft);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.card[data-pet=freya] .chip{background:var(--freya-soft)}
.chip.warn{background:var(--low);color:#fff}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.bar{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.bar i{display:block;height:6px;border-radius:6px;background:var(--hair);overflow:hidden;position:relative}
.bar i b{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--mare);transition:width .4s}
.card[data-pet=freya] .bar i b{background:var(--freya)}
.bar.low i b{background:var(--low)!important}

.stage-wrap{position:relative;border-radius:22px;overflow:hidden;background:#F7D9DF;box-shadow:0 0 0 2px var(--hair),0 8px 22px -12px rgba(120,60,75,.45)}
@media (max-width:520px){.stage-wrap{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));border-radius:0;box-shadow:none}}
#stage{display:block;width:100%;height:auto;aspect-ratio:480/320;max-width:100%;touch-action:manipulation;cursor:pointer}
.hint{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--ink);background:rgba(255,250,249,.82);padding:3px 9px;border-radius:999px;pointer-events:none}

.panel{background:var(--panel);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:9px}
.panel-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.target{font-size:13px;color:var(--muted)}
.target b{font-weight:400;color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:999px}
.tab{border:0;background:transparent;font:inherit;font-size:13px;color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer}
.tab[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(120,60,75,.18)}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.act{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--hair);border-radius:14px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0;transition:transform .08s, background .15s}
.act:active{transform:scale(.96)}
.act:hover{background:#FCEFF1}
.act .ic{font-size:22px;line-height:1}
.act .lb{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.act .sub{font-size:10.5px;color:var(--muted)}
.act.on{border-color:var(--mare);background:var(--mare-soft)}
.act.duo{grid-column:span 1}

.sheet{position:fixed;inset:0;background:rgba(74,43,49,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-body{background:var(--panel);width:100%;max-width:470px;border-radius:22px 22px 0 0;padding-block:16px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-height:80vh;overflow:auto}
.sheet h2{margin:0;font-size:17px;font-weight:400}
.sheet p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--hair);border-radius:14px;padding:10px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.opt .ic{font-size:26px}
.opt .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .t small{color:var(--muted);font-size:11px}
.opt[aria-pressed=true]{border-color:var(--mare);background:var(--mare-soft)}
.seg{display:flex;gap:6px}
.seg .opt{flex:1;justify-content:center;text-align:center}
.close{align-self:stretch;font:inherit;border:0;background:var(--ink);color:var(--panel);border-radius:14px;padding:11px;cursor:pointer}
.danger{font:inherit;border:1px solid var(--low);background:transparent;color:var(--low);border-radius:14px;padding:10px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){.card,.act,.bar i b{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1><span class="m">小馬蕾</span><span class="x">×</span><span class="f">芙蕾雅</span></h1>

  <section class="panel">
    <div class="panel-top">

      <div class="tabs" role="tablist" aria-label="動作分類">

        <button class="tab" role="tab" id="tab-play" data-tab="play" aria-selected="false" type="button">互動</button>

        <button class="tab" role="tab" id="tab-wear" data-tab="wear" aria-selected="false" type="button">換裝</button>
      </div>
    </div>
    <div class="actions" id="actions" role="tabpanel"></div>

</div>

<div class="sheet" id="sheet" hidden><div class="sheet-body" id="sheetBody"></div></div>
<div class="toast" id="toast" hidden></div>

<script>

const FOODS = [
  { id:'onigiri', icon:'🍙', name:'飯糰', desc:'飽足 +35', fx:{ hunger:35 } },
  { id:'cake', icon:'🍰', name:'草莓蛋糕', desc:'飽足 +20 · 心情 +12', fx:{ hunger:20, mood:12 }, sweet:true },

/* ---------- 房間位置 ---------- */
/* 房間圖 assets/backgrounds/bg_room.jpg（1536×1024）縮成 480×320 後的位置 */
const SPOTS = {
  bed1:{x:52,y:116}, bed2:{x:104,y:146}, sofa1:{x:226,y:122}, sofa2:{x:274,y:122}, window:{x:250,y:168},
  table1:{x:150,y:262}, table2:{x:198,y:266}, toys:{x:360,y:262}, center:{x:247,y:222},

};
const FLOOR = { x0:40, x1:440, y0:168, y1:300 };

/* ---------- 畫布 ---------- */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
function resize(){
  const dpr = min(3, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize(); window.addEventListener('resize', resize);

/* ---------- 繪圖小工具 ---------- */
function ell(x, y, rx, ry, rot = 0){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); }
function fs(fill, stroke, lw){ if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2.6; ctx.stroke(); } }
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function seg(x1, y1, x2, y2, w, col, L){
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  if (L){ ctx.strokeStyle = L; ctx.lineWidth = w + 4.6; ctx.stroke(); }
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function emoji(ch, x, y, size){
  ctx.save(); ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, x, y); ctx.restore();
}

/* =====================================================================
   Q 版角色繪製（本地座標：腳底為原點、往上為負，頭中心 y=-158）
   ===================================================================== */
const HY = -158;

function hands(pose, p){
  const w = sin(p * 8);
  switch (pose){
    case 'swing': return [[-31, -74 + w * 4], [31, -74 - w * 4]];
    case 'up': return [[-40, -150 + w * 3], [40, -150 - w * 3]];
    case 'surprise': return [[-45, -122], [45, -122]];
    case 'front': return [[-12, -88], [12, -88]];
    case 'mouth': return [[-13, -88], [9, -126 + abs(sin(p * 6)) * 4]];
    case 'drink': return [[-11, -124], [11, -124]];
    case 'cheeks': return [[-33, -134], [33, -134]];
    case 'hip': return [[-36, -82], [36, -82]];
    case 'hug': return [[-22, -90], [22, -90]];
    case 'reach': return [[-28, -134 + w * 3], [28, -134 - w * 3]];
    case 'comb': return [[-32, -74], [36 + sin(p * 5) * 4, -186 + sin(p * 5) * 10]];
    case 'brow': return [[-35, -80], [14, -176]];
    case 'game': return [[-14, -86 + abs(w) * 2], [14, -86 + abs(sin(p * 9)) * 2]];
    case 'deny': return [[-24 + sin(p * 14) * 7, -124], [24 + sin(p * 14) * 7, -124]];
    case 'cheek1': return [[-32, -74], [24, -130]];
    case 'pat': return [[-32, -74], [52, -150 + sin(p * 5) * 6]];
    case 'feed': return [[-32, -74], [52, -118]];
    case 'splash': return [[-44, -112 + w * 8], [44, -112 - w * 8]];
    case 'wave': return [[-32, -74], [44, -152 + sin(p * 9) * 6]];
    default: return [[-32, -74], [32, -74]];
  }
}

const EXPR = {

function animState(pet, p){
  const st = { pose:'down', body:'stand', bob:0, sway:0, tilt:0, headDrop:0, leg:0, walk:false, expr:null, ear:null, earRed:false,
    droop:0, item:null, itemAt:'r', plush:false, plushHigh:false, fx:null, back:false, kick:false, ice:false, squash:0 };
  switch (pet.anim){
    case 'idle': st.bob = sin(p * 2.6) * 1.2; st.sway = sin(p * 1.3) * .035; break;
    case 'walk': st.pose = 'swing'; st.walk = true; st.leg = p * 11; st.bob = abs(sin(p * 11)) * 4; break;
    case 'happy': { st.pose = 'up'; const c = p % 1.4; st.bob = c < 1 ? abs(sin(c / .5 * PI)) * 14 : 0; st.expr = 'happy'; st.fx = 'note'; break; }
    case 'excited': { st.pose = 'up'; const c = p % 1.2; st.bob = c < 1 ? abs(sin(c / .5 * PI)) * 16 : 0; st.expr = 'excited'; st.fx = 'sparkle'; break; }
    case 'sad': st.headDrop = 4; st.bob = -2; st.expr = 'sad'; st.droop = 1; st.fx = 'gloom'; break;
    case 'pout': st.headDrop = 2; st.expr = 'pout'; st.sway = sin(p * 2) * .04; st.fx = 'sweat'; break;
    case 'angry': st.pose = 'hip'; st.bob = (floor(p * 5) % 2) * 2.5; st.expr = 'angry'; st.fx = 'anger'; break;
    case 'shy': st.pose = 'cheeks'; st.sway = sin(p * 3.2) * .07; st.expr = 'shy'; st.earRed = true; st.fx = 'heart'; break;
    case 'surprised': st.pose = 'surprise'; st.bob = p < .35 ? sin(p / .35 * PI) * 16 : 0; st.expr = 'surprised'; st.fx = 'bang'; break;
    case 'tired': st.bob = -3 + sin(p * 1.2); st.sway = sin(p * .9) * .05; st.expr = 'sleepy'; st.droop = .6; st.fx = 'zz'; break;
    case 'sleep': st.body = 'lie'; st.bob = sin(p * 1.6) * .8; st.expr = pet.sick ? 'sick' : 'sleep'; st.fx = 'zzz'; st.ice = pet.sick; break;
    case 'eat': st.pose = 'mouth'; st.item = pet.prop || '🍙'; st.expr = 'eat'; st.bob = sin(p * 6) * .8; st.fx = p % 2 < 1 ? 'heart' : null; st.ear = .6; break;
    case 'fed': st.pose = 'front'; st.expr = 'ah'; st.item = pet.prop || '🍙'; st.itemAt = 'mouthfeed'; st.tilt = -.06; break;
    case 'drink': st.pose = 'drink'; st.item = '🥛'; st.itemAt = 'chigh'; st.expr = 'drink'; st.tilt = -.08; break;
    case 'play_toy': st.body = 'sit'; st.pose = 'up'; st.item = '🧸'; st.itemAt = 'cup'; st.bob = abs(sin(p * 4)) * 3; st.expr = 'happy'; st.fx = 'note'; st.kick = true; break;
    case 'bath': st.body = 'tub'; st.pose = 'splash'; st.expr = p % 3 < 2 ? 'happy' : 'bliss'; st.fx = 'bubbles'; st.bob = sin(p * 3); break;
    case 'groom': st.pose = 'comb'; st.expr = 'smile'; st.fx = 'sparkle'; st.tilt = sin(p * 2.5) * .05; break;
    case 'search': st.pose = 'brow'; st.expr = 'normal'; st.fx = 'question'; st.sway = sin(p * 2) * .06; break;
    case 'wait': st.body = 'sit'; st.kick = true; st.expr = 'pout'; st.sway = sin(p * 1.5) * .04; break;
    case 'headpat': st.squash = .04 + sin(p * 7) * .02; st.expr = 'bliss'; st.fx = 'heart'; st.ear = .55 + sin(p * 12) * .1; st.earRed = pet.id === 'freya'; break;
    case 'minigame': st.body = 'sit'; st.pose = 'game'; st.item = '🎮'; st.itemAt = 'c'; st.expr = 'focus'; st.bob = sin(p * 8) * .6; break;
    case 'sick': st.body = 'sit'; st.expr = 'sick'; st.ice = true; st.droop = 1; st.sway = sin(p) * .04; st.fx = 'sweat'; break;
    case 'mare_spoiled':
      if (p < 1.8){ st.pose = 'hug'; st.plush = true; st.sway = sin(p * 4) * .1; } else { st.pose = 'reach'; st.bob = abs(sin(p * 5)) * 3; }

    case 'mare_prank': st.pose = 'mouth'; st.expr = 'prank'; st.fx = 'sparkle'; st.bob = abs(sin(p * 7)) * 2; break;
    case 'cry': st.expr = 'cry'; st.bob = abs(sin(p * 8)) * 1.5; st.droop = 1; break;
    case 'confused': st.pose = 'cheek1'; st.tilt = .14; st.expr = 'confused'; st.fx = 'question'; break;
    case 'wave': st.pose = 'wave'; st.expr = 'happy'; st.bob = abs(sin(p * 5)) * 3; st.fx = 'heart'; break;
    case 'care': st.pose = 'pat'; st.expr = 'gentle'; st.fx = 'heart'; st.ear = .35; break;
    case 'care_m': st.body = 'lie'; st.expr = p < 3 ? 'sick' : 'gentle'; st.ice = true; break;
    case 'tv': st.body = 'sit'; st.back = true; st.bob = (p % 4 > 3) ? abs(sin(p * 10)) * 2 : 0; st.sway = sin(p * .8) * .02; break;
    case 'duo_play': st.pose = floor(p / .8) % 2 ? 'up' : 'front'; st.expr = 'happy'; st.bob = abs(sin(p * 4)) * 3; break;
    case 'duo_feed': st.body = 'sit'; st.pose = 'feed'; st.item = '🍰'; st.expr = 'gentle'; break;
    case 'duo_eaten': st.body = 'sit'; if (p % 3 < 1.2){ st.pose = 'front'; st.expr = 'ah'; } else { st.pose = 'mouth'; st.expr = 'eat'; st.fx = 'heart'; } break;
    case 'duo_eat': st.body = 'sit'; st.pose = 'mouth'; st.item = '🍙'; st.expr = 'eat'; break;
    case 'mg_run': st.pose = 'up'; st.walk = true; st.leg = p * 12; st.bob = abs(sin(p * 12)) * 3; st.expr = 'excited'; break;
  }
  if (!st.expr) st.expr = baseExpr(pet);
  if (st.ear == null) st.ear = EAR_FOR[st.expr] ?? .35;
  if (!st.droop && (st.expr === 'sad' || st.expr === 'pout' || st.expr === 'sick')) st.droop = .7;
  if (st.expr === 'shy') st.earRed = true;
  return st;
}

function baseExpr(pet){
  const s = pet.stats;
  if (pet.sick) return 'sick';
  if (pet.sleeping) return 'sleep';
  if (s.energy < 20) return 'sleepy';
  if (s.hunger < 20 || s.clean < 20) return 'pout';
  if (s.mood < 25) return 'sad';
  if (s.mood > 60) return 'smile';
  return 'normal';
}

function backHair(C, O, st, sway){

function bangsPath(){

  if (!st) return { x: pet.x, y: pet.y - 120 };

  const sit = st.body === 'sit' ? 24 : st.body === 'tub' ? 34 : 0;

}

let lastInput = performance.now();
let selected = 'mare';
let duo = null;
let mg = null;
let speed = 1;

class Pet {
  constructor(id, x, y){
    this.id = id; this.x = x; this.y = y; this.dir = id === 'mare' ? 1 : -1;
    this.outfit = 'daily';
    this.stats = { hunger:80, mood:75, clean:80, energy:85, health:95, affection:50 };
    this.sleeping = false; this.sick = false;
    this.queue = []; this.cur = null; this.target = null;
    this.anim = 'idle'; this.animStart = performance.now();
    this.nextThink = performance.now() + rnd(3000, 6000);
    this.speech = null; this.prop = null;
    this.blink = false; this.blinkAt = performance.now() + rnd(1500, 4000);
  }
  get other(){ return pets.find(p => p !== this); }
  setAnim(a){ if (this.anim !== a){ this.anim = a; this.animStart = performance.now(); } }
  say(text, dur = 3200){ this.speech = { text, until: performance.now() + dur }; }
  run(steps){ this.queue = steps.slice(); this.cur = null; this.target = null; }
  rest(){ return this.sleeping ? 'sleep' : this.sick ? 'sick' : 'idle'; }
  busy(){ return !!(this.cur || this.queue.length || this.target); }
  moveTo(x, y){ this.target = { x, y }; }
  update(dt, now){
    if (now > this.blinkAt){ this.blink = true; if (now > this.blinkAt + 130){ this.blink = false; this.blinkAt = now + rnd(2200, 5200); } }
    if (this.target){
      const dx = this.target.x - this.x, dy = this.target.y - this.y, d = hypot(dx, dy), sp = 62 * dt;
      if (abs(dx) > 1) this.dir = dx > 0 ? 1 : -1;
      if (d <= sp){ this.x = this.target.x; this.y = this.target.y; this.target = null; }
      else { this.x += dx / d * sp; this.y += dy / d * sp; this.setAnim('walk'); return; }
    }
    if (duo && duo.members.includes(this)) return;
    if (!this.cur && this.queue.length){
      const c = this.cur = this.queue.shift();
      if (c.to){ this.moveTo(c.to.x, c.to.y); }
      c.started = false;
      return;
    }
    if (this.cur){
      const c = this.cur;
      if (!c.started){
        c.started = true; c.t0 = now;
        if (c.face) this.dir = c.face;
        if (c.prop !== undefined) this.prop = c.prop;
        if (c.start) c.start(this);
        if (c.say) this.say(typeof c.say === 'function' ? c.say(this) : c.say);
        this.setAnim(c.anim || this.rest());
      }
      if (now - c.t0 >= (c.dur || 0)){
        if (c.end) c.end(this);
        this.cur = null;
        if (!this.queue.length) this.setAnim(this.rest());
      }
      return;
    }
    if (this.anim === 'walk' || (!['idle', 'sleep', 'sick'].includes(this.anim))) this.setAnim(this.rest());
    if (this.anim !== this.rest()) this.setAnim(this.rest());
    think(this, now);
  }
}

const pets = [new Pet('mare', 200, 240), new Pet('freya', 290, 244)];
const P = id => pets.find(p => p.id === id);

function eff(pet, d){
  for (const k in d) pet.stats[k] = clamp(pet.stats[k] + d[k]);
  if (pet.sick && pet.stats.health >= 55) pet.sick = false;
}
function tick(pet, minutes){
  const s = pet.stats;
  s.hunger -= .14 * minutes;
  s.clean -= .08 * minutes;
  s.energy += (pet.sleeping ? .6 : -.1) * minutes;
  let moodDrift = -.05;
  if (s.hunger < 30) moodDrift -= .1;
  if (s.clean < 30) moodDrift -= .06;
  if (s.energy < 20) moodDrift -= .06;
  s.mood += moodDrift * minutes;
  s.affection -= .01 * minutes;
  if (s.hunger < 15 || s.clean < 15) s.health -= .15 * minutes; else s.health += .04 * minutes;
  for (const k in s) s[k] = clamp(s[k], k === 'affection' ? 0 : 5, 100);
  if (!pet.sick && s.health < 35) pet.sick = true;
}

function goSleep(pet, quiet){
  const spot = pet.id === 'mare' ? SPOTS.bed1 : SPOTS.bed2;
  pet.run([{ to: spot, dur: 0, end: p => { p.sleeping = true; p.setAnim('sleep'); if (!quiet) p.say(line(p, 'night'), 2000); } }]);
}
function wake(pet){
  pet.sleeping = false;
  pet.run([{ anim:'tired', dur:1600, say: line(pet, 'wake') }, { to: { x: pet.id === 'mare' ? 170 : 240, y: 200 }, dur: 0 }]);
}

function think(pet, now){
  if (duo || mg || now < pet.nextThink) return;
  pet.nextThink = now + rnd(4500, 9000);
  const s = pet.stats, o = pet.other;
  if (pet.sleeping){
    if (s.energy >= 98 && !isNight()) wake(pet);
    else if (random() < .12) pet.say(line(pet, 'sleepTalk'), 1800);
    return;
  }
  if (pet.id === 'freya' && P('mare').sick && !pet.sick && !P('mare').sleeping && random() < .7){ startDuo('care'); return; }

  if (s.hunger < 25 && random() < .6){ pet.run([{ anim:'sad', dur:2600, say: line(pet, 'hungry') }]); return; }
  if (s.clean < 25 && random() < .5){ pet.run([{ anim:'pout', dur:2400, say: line(pet, 'dirty') }]); return; }
  if (s.energy < 30 && random() < .5){ pet.run([{ anim:'tired', dur:2600, say: line(pet, 'sleepy') }]); return; }
  if (pet.id === 'mare' && s.affection > 55 && random() < .12){
    pet.run([{ to: SPOTS.front1, dur:0 }, { anim:'mare_spoiled', dur:3600, say: line(pet, 'spoiled'), end: p => eff(p, { affection:2 }) }]); return;
  }
  if (pet.id === 'mare' && s.mood > 50 && random() < .07 && !o.busy() && !o.sleeping && !o.sick){ startDuo('prank'); return; }
  if (pet.id === 'freya' && random() < .1){ pet.run([{ anim:'confused', dur:2600, say: line(pet, 'confused') }]); return; }
  const r = random();
  if (r < .35) pet.run([{ to: { x: rnd(FLOOR.x0, FLOOR.x1), y: rnd(FLOOR.y0, FLOOR.y1) }, dur: 0 }]);

  else if (r < .63) pet.run([{ to: SPOTS.window, dur:0 }, { anim:'idle', dur:3000 }]);
  else if (r < .72 && s.mood > 65) pet.run([{ anim:'happy', dur:2000 }]);
  else if (r < .8) pet.run([{ to: pet.id === 'mare' ? SPOTS.sofa1 : SPOTS.sofa2, dur:0 }, { anim:'idle', dur:4000 }]);
}

function updateDuo(now){
  if (!duo) return;

    if (D.say.freya) f.say(D.say.freya);

/* ---------- 小遊戲：接點心 ---------- */
const GOOD = ['🍓', '🍰', '🍬', '🍮', '🍩'];
function startMinigame(pet){
  for (const p of pets){ p.queue = []; p.cur = null; p.target = null; }
  duo = null;
  mg = { pet, t0: performance.now(), score: 0, items: [], spawn: 0, px: W / 2, tx: W / 2, done: false, saved: { x: pet.x, y: pet.y } };
  pet.x = W / 2; pet.y = H - 8; pet.setAnim('mg_run');
  document.getElementById('hint').textContent = '左右拖曳或用方向鍵移動，接住點心、避開蟲子！';
}
function updateMinigame(dt, now){
  const g = mg, pet = g.pet, e = (now - g.t0) / 1000;
  if (g.done){ if (now > g.doneAt) endMinigame(); return; }
  g.px += (g.tx - g.px) * min(1, dt * 12);
  pet.dir = g.tx >= pet.x ? 1 : -1; pet.x = g.px;
  g.spawn -= dt;
  if (g.spawn <= 0 && e < 19){ g.spawn = rnd(.38, .62); const bad = random() < .17; g.items.push({ x: rnd(24, W - 24), y: 64, v: rnd(95, 150) + e * 4, ch: bad ? '🐛' : pick(GOOD), bad }); }
  for (const it of g.items){
    it.y += it.v * dt;
    if (!it.hit && it.y > H - 100 && it.y < H - 56 && abs(it.x - g.px) < 36){
      it.hit = true;
      if (it.bad){ g.score = max(0, g.score - 2); pet.setAnim('surprised'); pet.say(pet.id === 'freya' ? '呀！蟲子！' : '哇！', 900); setTimeout(() => mg && !mg.done && pet.setAnim('mg_run'), 600); }
      else { g.score++; g.pop = { x: it.x, y: it.y, t: now }; }
    }
  }
  g.items = g.items.filter(it => !it.hit && it.y < H + 30);
  if (e >= 20){
    g.done = true; g.doneAt = now + 2600; pet.setAnim(g.score >= 12 ? 'excited' : 'happy');
    pet.say(g.score >= 12 ? `接到 ${g.score} 個！太厲害了吧！` : `接到 ${g.score} 個～好好玩！`, 2600);
  }
}
function endMinigame(){
  const g = mg, pet = g.pet;
  eff(pet, { mood: min(30, g.score * 1.6), energy: -10, hunger: -6, affection: 2 });
  pet.x = g.saved.x; pet.y = g.saved.y; pet.setAnim(pet.rest());
  mg = null; document.getElementById('hint').textContent = '點角色選擇 · 點頭可以摸頭';
  save(); renderUI();
}
function drawMinigame(now){
  const g = mg, e = (now - g.t0) / 1000;
  const grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, '#FDE7EC'); grad.addColorStop(1, '#FBE8C9');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; for (let i = 0; i < 8; i++){ ell((i * 53 + now / 40) % (W + 40) - 20, 40 + (i % 3) * 22, 18, 7); ctx.fill(); }
  ctx.fillStyle = '#EAC9A6'; ctx.fillRect(0, H - 8, W, 8);
  for (const it of g.items) emoji(it.ch, it.x, it.y, 26);
  drawPet(g.pet, now); drawSpeech(g.pet, now);
  if (g.pop && now - g.pop.t < 500){ ctx.globalAlpha = 1 - (now - g.pop.t) / 500; txt('+1', g.pop.x, g.pop.y - 20 - (now - g.pop.t) / 20, 18, '#E07A92'); ctx.globalAlpha = 1; }
  rr(10, 10, 132, 34, 17); fs('rgba(255,255,255,.92)', '#EFB3C2', 1.5);
  ctx.fillStyle = '#4A2B31'; ctx.font = `15px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`接點心　${g.score} 個`, 22, 27);
  rr(W - 82, 10, 72, 34, 17); fs('rgba(255,255,255,.92)', '#EFB3C2', 1.5);
  ctx.textAlign = 'center'; ctx.fillText(`${max(0, 20 - floor(e))} 秒`, W - 46, 27);
}

const toastEl = document.getElementById('toast');
let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 2400); }

function prep(pet, allowSleeping){
  lastInput = performance.now();
  if (mg){ toast('小遊戲進行中'); return false; }
  if (duo && duo.members.includes(pet)){ duo = null; for (const p of pets) p.setAnim(p.rest()); }
  if (pet.sleeping && !allowSleeping){ toast(`${CHARS[pet.id].name}正在睡覺。先按「起床」叫醒她吧。`); return false; }
  return true;
}
function doAction(type, arg){
  const pet = P(selected), C = CHARS[pet.id];
  switch (type){
    case 'feed':
      if (!prep(pet)) return;
      pet.run([
        { anim:'fed', dur:1100, prop: arg.icon, say:'啊～' },
        { anim:'eat', dur:2600, say: p => line(p, 'fed'), end: p => {
            eff(p, arg.fx);
            if (arg.sweet && p.id === 'mare') eff(p, { mood:5 });
            if (p.id === 'freya') eff(p, { mood:3 });
            eff(p, { affection:1 }); p.prop = null;
          } }
      ]); break;
    case 'drink':
      if (!prep(pet)) return;
      pet.run([{ anim:'drink', dur:2200, say: line(pet, 'drink'), end: p => eff(p, { hunger:6, health:3 }) }]); break;
    case 'bath':
      if (!prep(pet)) return;
      pet.run([{ anim:'bath', dur:4200, say: line(pet, 'bath'), end: p => eff(p, { clean:100, mood:6 }) }]); break;
    case 'sleep':
      lastInput = performance.now();
      if (mg) return;
      if (duo && duo.members.includes(pet)) duo = null;
      if (pet.sleeping) wake(pet); else goSleep(pet);
      break;
    case 'groom':
      if (!prep(pet)) return;
      pet.run([{ anim:'groom', dur:3000, say: line(pet, 'groom'), end: p => eff(p, { clean:15, mood:4 }) }]); break;
    case 'medicine':
      if (!prep(pet, true)) return;
      if (!pet.sick && pet.stats.health > 70){ pet.say(line(pet, 'healthy')); return; }
      pet.sleeping = false;
      pet.run([{ anim:'sick', dur:1500, say: line(pet, 'medicine') }, { anim:'smile', dur:1200, end: p => { eff(p, { health:45 }); } }]); break;
    case 'pat':
      if (!prep(pet, true)) return;
      if (pet.sleeping){ pet.say(line(pet, 'sleepTalk'), 1800); eff(pet, { mood:2, affection:1 }); return; }
      pet.run([{ anim:'headpat', dur:2200, say: line(pet, 'pat'), end: p => eff(p, { mood:6, affection:4 }) }]); break;
    case 'praise':
      if (!prep(pet)) return;
      if (pet.id === 'freya') pet.run([{ anim:'freya_flustered', dur:3400, say: line(pet, 'praise'), end: p => eff(p, { mood:8, affection:3 }) }]);
      else pet.run([{ anim:'happy', dur:1400, say: line(pet, 'praise') }, { anim:'mare_spoiled', dur:2600, end: p => eff(p, { mood:8, affection:3 }) }]);
      break;
    case 'toy':
      if (!prep(pet)) return;
      pet.run([{ to: SPOTS.toys, dur:0, face:1 }, { anim:'play_toy', dur:4000, say: line(pet, 'toy'), end: p => eff(p, { mood:15, energy:-8, clean:-4, hunger:-3 }) }]); break;
    case 'minigame':
      if (!prep(pet)) return;
      if (pet.stats.energy < 15){ pet.run([{ anim:'tired', dur:2000, say: line(pet, 'sleepy') }]); return; }
      startMinigame(pet); break;
    case 'call':
      lastInput = performance.now();
      if (mg) return;
      duo = null;
      pets.forEach((p, i) => {
        if (p.sleeping) return;
        p.run([{ to: i ? SPOTS.front2 : SPOTS.front1, dur:0 }, { anim:'wave', dur:2200, say: line(p, 'greet') }]);
      });
      break;
    case 'outfit':
      if (!prep(pet, true)) return;
      pet.outfit = arg;
      if (!pet.sleeping) pet.run([{ anim:'happy', dur:1600, say: line(pet, 'outfit') }]);
      break;
    case 'duo': {
      lastInput = performance.now();
      if (mg) return;
      const m = P('mare'), f = P('freya');
      if (arg === 'care' && f.sick){ toast('芙蕾雅自己也生病了，先讓她吃藥吧。'); return; }
      if (arg !== 'sleep' && arg !== 'care' && (m.sick || f.sick)){ toast('有人生病了，先照顧她吧。'); return; }
      startDuo(arg); break;
    }
  }
  save(); renderUI();
}

/* ---------- 畫面點擊 ---------- */
function toLocal(ev){
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', ev => {
  const { x, y } = toLocal(ev);
  lastInput = performance.now();
  if (mg){ mg.tx = clamp(x, 26, W - 26); return; }
  const hit = [...pets].sort((a, b) => b.y - a.y).find(p => {
    const st = p._st, S = p._S || .58;
    if (p._top != null) return abs(x - p._cx) < max(30, p._w * .42) && y > p._top - 4 && y < p._by + 6;
    if (st && st.body === 'lie') return x > p.x - 170 * S && x < p.x + 10 && abs(y - p.y) < 50 * S;
    const top = headPt(p).y;
    return abs(x - p.x) < 40 && y > top - 4 && y < p.y + 6;
  });
  if (!hit) return;
  const wasSel = selected === hit.id;
  selected = hit.id; renderUI();
  const st = hit._st, top = headPt(hit).y;
  const onHead = hit._top != null ? (hit._kind === 'lie' ? x < hit._cx + hit._w * .1 : y < hit._top + hit._h * .45) : st && st.body !== 'lie' ? y < top + 62 * (hit._S || .58) / .58 * .9 : x < hit.x - 100 * (hit._S || .58);
  if (onHead && (wasSel || true)) doAction('pat');
});
cv.addEventListener('pointermove', ev => { if (mg && (ev.buttons || ev.pointerType !== 'mouse')){ mg.tx = clamp(toLocal(ev).x, 26, W - 26); } });
window.addEventListener('keydown', ev => {
  if (!mg) return;
  if (ev.key === 'ArrowLeft'){ mg.tx = clamp(mg.tx - 44, 26, W - 26); ev.preventDefault(); }
  if (ev.key === 'ArrowRight'){ mg.tx = clamp(mg.tx + 44, 26, W - 26); ev.preventDefault(); }
});

    h += btn('🛏️', '一起睡', 'duo', 'sleep');
    h += btn('📺', '看電視', 'duo', 'tv');
    h += btn('🩹', '照顧', 'duo', 'care', '芙蕾雅→小馬蕾');
    h += btn('🐛', '惡作劇', 'duo', 'prank', '小馬蕾的');
  } else {
    for (const k of OUTFIT_KEYS) h += btn(OUTFIT_ICON[k], OUTFIT_LABEL[k], 'outfit', k, '', pet.outfit === k);
  }
  box.innerHTML = h;
}
document.getElementById('actions').addEventListener('click', ev => {
  const b = ev.target.closest('.act'); if (!b) return;
  const act = b.dataset.act, arg = b.dataset.arg;
  if (act === 'feedMenu') return openFeed();
  if (act === 'special'){
    const pet = P(selected);
    if (!prep(pet)) return;
    if (pet.id === 'mare') pet.run([{ to: SPOTS.front1, dur:0 }, { anim:'mare_spoiled', dur:3600, say: line(pet, 'spoiled'), end: p => eff(p, { affection:3, mood:4 }) }]);
    else pet.run([{ anim:'confused', dur:2400, say: line(pet, 'confused') }, { anim:'smile', dur:1500, say:'啊，想起來了～' }]);
    renderUI(); return;
  }
  doAction(act, arg);
});
document.querySelector('.tabs').addEventListener('click', ev => {
  const b = ev.target.closest('.tab'); if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t === b)));
  renderActions();
});
function renderUI(){ renderCards(); renderActions(); }

/* ---------- 底部選單 ---------- */
const sheet = document.getElementById('sheet'), sheetBody = document.getElementById('sheetBody');
function openSheet(html, bind){ sheetBody.innerHTML = html; sheet.hidden = false; bind && bind(); sheetBody.querySelector('button')?.focus(); }
function closeSheet(){ sheet.hidden = true; }
sheet.addEventListener('click', ev => { if (ev.target === sheet || ev.target.closest('[data-close]')) closeSheet(); });
window.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !sheet.hidden) closeSheet(); });
function openFeed(){
  const pet = P(selected);
  openSheet(`<h2>要給${CHARS[pet.id].name}吃什麼？</h2>
    <div class="opts">${FOODS.map(f => `<button class="opt" type="button" data-food="${f.id}"><span class="ic" aria-hidden="true">${f.icon}</span><span class="t">${f.name}<small>${f.desc}${f.sweet && pet.id === 'mare' ? ' · 最愛甜食' : ''}</small></span></button>`).join('')}</div>
    <button class="close" type="button" data-close>取消</button>`, () => {
    sheetBody.querySelectorAll('[data-food]').forEach(b => b.addEventListener('click', () => { closeSheet(); doAction('feed', FOODS.find(f => f.id === b.dataset.food)); }));
  });
}
document.getElementById('btnSettings').addEventListener('click', openSettings);
function openSettings(){
  let armed = false;
  openSheet(`<h2>設定</h2>
    <p>時間流速會影響飽足、清潔、精力等數值下降的速度。測試時可以調快。</p>
    <div class="seg">${[1, 10, 60].map(v => `<button class="opt" type="button" data-speed="${v}" aria-pressed="${speed === v}">${v}×</button>`).join('')}</div>
    <p>目前角色是依照規格書（2.3 頭身、表情疊加）即時繪製的佔位版本。正式 Sprite 完成後，照命名規則登記到 SPRITE_OVERRIDES 就會自動替換。</p>
    <button class="danger" type="button" id="btnReset">重新開始（清除存檔）</button>
    <button class="close" type="button" data-close>完成</button>`, () => {
    sheetBody.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
      speed = +b.dataset.speed; sheetBody.querySelectorAll('[data-speed]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); save();
    }));
    const r = sheetBody.querySelector('#btnReset');
    r.addEventListener('click', () => {
      if (!armed){ armed = true; r.textContent = '再按一次確認清除'; return; }
      resetGame(); closeSheet(); toast('已重新開始');
    });
  });
}

/* =====================================================================
   存檔（登入時存到雲端個人空間，否則存在這台裝置）
   ===================================================================== */
const LS_KEY = 'mare-freya-pet-v1';
let cloudDoc = null;
function serialize(){
  return { v:1, savedAt: Date.now(), speed,
    pets: Object.fromEntries(pets.map(p => [p.id, { stats: { ...p.stats }, outfit: p.outfit, sleeping: p.sleeping, sick: p.sick, x: p.x, y: p.y }])) };
}
function applySave(d, catchUp = true){
  if (!d || !d.pets) return;
  speed = d.speed || 1;
  for (const p of pets){
    const s = d.pets[p.id]; if (!s) continue;
    Object.assign(p.stats, s.stats); p.outfit = OUTFIT_KEYS.includes(s.outfit) ? s.outfit : 'daily';
    p.sleeping = !!s.sleeping; p.sick = !!s.sick;
    if (p.sleeping){ const b = p.id === 'mare' ? SPOTS.bed1 : SPOTS.bed2; p.x = b.x; p.y = b.y; }
    else if (typeof s.x === 'number'){ p.x = clamp(s.x, FLOOR.x0, FLOOR.x1); p.y = clamp(s.y, FLOOR.y0, FLOOR.y1); }
    p.queue = []; p.cur = null; p.target = null; p.setAnim(p.rest());
  }
  if (catchUp){
    const mins = min(12 * 60, max(0, (Date.now() - d.savedAt) / 60000) * speed);
    for (let i = 0; i < mins; i++) pets.forEach(p => tick(p, 1));
    return mins;
  }
  return 0;
}
let saveTimer = 0;
function save(){
  const d = serialize();
  try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e) {}
  const now = Date.now();
  if (cloudDoc && now - saveTimer > 8000){ saveTimer = now; cloudDoc.set(d).catch(() => {}); }
}
function resetGame(){
  for (const p of pets){ p.stats = { hunger:80, mood:75, clean:80, energy:85, health:95, affection:50 }; p.outfit = 'daily'; p.sleeping = p.sick = false; p.queue = []; p.cur = null; p.target = null; p.setAnim('idle'); }
  P('mare').x = 200; P('mare').y = 240; P('freya').x = 290; P('freya').y = 244;
  duo = null; mg = null; speed = 1; saveTimer = 0; save(); renderUI(); greet();
}
function greet(){
  pets.forEach((p, i) => { if (!p.sleeping && !p.sick) p.run([{ anim:'wave', dur:2400, say: line(p, 'greet') }]); });
}
async function connectCloud(){
  try {
    const cl = window.claude; if (!cl || !cl.use) return;
    const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    cloudDoc = db.collection('data/users/' + id).doc('pet-save');
    const snap = await cloudDoc.get();
    if (snap.exists){
      const d = snap.data();
      if (d && d.savedAt > (bootSavedAt || 0)){ applySave(d); renderUI(); }
    }
    saveTimer = 0; save();
  } catch (e) { cloudDoc = null; }
}

/* =====================================================================
   主迴圈
   ===================================================================== */
let last = performance.now(), uiT = 0, saveT = 0, bootSavedAt = 0;
function frame(now){
  const dt = min(.1, (now - last) / 1000); last = now;
  if (mg) updateMinigame(dt, now);
  else {
    updateDuo(now);
    for (const p of pets){ tick(p, dt / 60 * speed); p.update(dt, now); }
  }
  ctx.clearRect(0, 0, W, H);
  if (mg) drawMinigame(now);
  else {
    const tvOn = duo && duo.type === 'tv' && duo.stage === 'act';
    drawRoom(now, tvOn);
    const list = pets.map(p => ({ y: p.y, d: () => drawPet(p, now) }));
    list.sort((a, b) => a.y - b.y).forEach(o => o.d());
    drawDuoFx(now);
    for (const p of pets) drawFx(p, now);
    bubbleRects.length = 0;
    for (const p of [...pets].sort((a, b) => (a.speech?.until || 0) - (b.speech?.until || 0))) drawSpeech(p, now);
  }
  uiT += dt; saveT += dt;
  if (uiT > .5){ uiT = 0; renderCards(); }
  if (saveT > 15){ saveT = 0; save(); }
  requestAnimationFrame(frame);
}
function clock(){
  const d = new Date(), h = d.getHours();
  const part = h < 6 ? '深夜' : h < 11 ? '早上' : h < 14 ? '中午' : h < 18 ? '下午' : h < 21 ? '傍晚' : '晚上';
  document.getElementById('clock').textContent = `${part} ${String(h).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} · 時間流速 ${speed}×`;
}

function start(hotData){
  buildCards();
  let d = hotData && hotData.save;
  let fromHot = !!d;
  if (!d){ try { d = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { d = null; } }
  if (d){
    bootSavedAt = d.savedAt || 0;
    const away = applySave(d, !fromHot);
    if (!fromHot && away > 10) setTimeout(greet, 700);
  } else setTimeout(greet, 700);
  if (hotData && hotData.selected) selected = hotData.selected;
  renderUI(); clock(); setInterval(clock, 15000);
  requestAnimationFrame(t => { last = t; frame(t); });
  connectCloud();
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
}
try { window.claude?.hot?.snapshot?.(() => ({ save: serialize(), selected })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
